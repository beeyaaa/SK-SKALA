services:
  vllm-cpu:
    # Apple GPU/Metal이 아니라 Docker Linux VM의 ARM CPU를 쓴다 — NVIDIA GPU 없이도
    # OpenAI 호환 API·continuous batching·KV Cache 동작을 그대로 확인할 수 있는 가장
    # 이식성 높은 경로. 출처: manual/통과조건/L15_운영배포/실습_진화관점/09_ML_LLM모델서빙_진화관점/
    # wave2_runtime/04_vllm/compose.mac-cpu.yaml 을 그대로 가져옴(수정 없음).
    image: vllm/vllm-openai-cpu:latest-arm64
    platform: linux/arm64
    command:
      - ${MODEL_ID:-Qwen/Qwen2.5-0.5B-Instruct}
      - --served-model-name=${SERVED_MODEL_NAME:-assistant}
      - --dtype=float16
      - --max-model-len=${MAX_MODEL_LEN:-1024}
      - --max-num-seqs=${MAX_NUM_SEQS:-4}
      - --api-key=${VLLM_API_KEY:?set VLLM_API_KEY}
      - --generation-config=vllm
    ports: ["8000:8000"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # vLLM CPU backend가 KV Cache에 예약할 호스트 메모리. 단위는 GiB다.
      VLLM_CPU_KVCACHE_SPACE: ${VLLM_CPU_KVCACHE_SPACE:-1}
      VLLM_CPU_OMP_THREADS_BIND: ${VLLM_CPU_OMP_THREADS_BIND:-0-7}
    volumes:
      - hf-cache-cpu:/root/.cache/huggingface
    shm_size: 2gb
    init: true
    stop_grace_period: 30s
    cap_add: [SYS_NICE]
    security_opt: [seccomp=unconfined]

volumes:
  # 최초 1회만 모델을 내려받고(Qwen2.5-0.5B-Instruct 기준 약 77초), 이후로는 이
  # 볼륨에 캐시된 가중치를 재사용해 기동이 빨라진다.
  hf-cache-cpu: {}
