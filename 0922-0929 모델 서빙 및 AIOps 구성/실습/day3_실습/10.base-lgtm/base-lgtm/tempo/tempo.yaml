# Tempo 공식 문서의 로컬 배포 예시 그대로 — OTLP gRPC/HTTP 수신, 로컬 디스크 저장.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

usage_report:
  reporting_enabled: false
