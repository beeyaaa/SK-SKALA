# 작성자: 홍은비
# 작성일자: 2026-08-21
# 변경사항: SPA 정적 파일 제공, WAS API·Health Check Reverse Proxy 구성

server {
    # Nginx가 컨테이너 내부의 모든 IPv4 인터페이스에서 80번 포트를 수신한다.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 방법 1: 하나의 정적 HTML을 제공한다.
    # 요청한 정적 파일이 없으면 index.html을 반환하여 SPA 진입점을 유지한다.
    location / {
        try_files $uri /index.html;
    }

    # 브라우저의 REST API 요청을 Docker 내부의 WAS 서비스로 전달한다.
    # board-was는 Compose 내부 DNS가 WAS 컨테이너 IP로 해석하는 서비스명이다.
    location /api/ {
        proxy_pass http://board-was:5000;
        # 원래 요청의 Host와 Client IP/Protocol 정보를 WAS에 전달한다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend의 연결 상태 표시가 WAS와 DB의 준비 상태를 확인하도록 전달한다.
    # Exact Match(=)를 사용하여 /health 경로에만 이 규칙을 적용한다.
    location = /health {
        proxy_pass http://board-was:5000/health;
        proxy_set_header Host $host;
    }
}
